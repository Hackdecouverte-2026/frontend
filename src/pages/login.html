<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles.css">
    <title>Document</title>
</head>
<body>
    <h1>Login</h1>
    <form action="" id="loginForm">
        <div>Username: <input type="text" id="login-username"></div>
        <div>Password: <input type="password" id="login-password"></div>
    </form>
    <button class="ActionButton" id="signInBtn">Sign-in</button>
</body>
<script>
    const Form = document.getElementById("loginForm")
    document.getElementById("signInBtn").addEventListener("click",()=>{
        window.parent.postMessage(JSON.stringify({username:document.getElementById("login-username").value,password: document.getElementById("login-password").value}))
    })
</script>
</html>
